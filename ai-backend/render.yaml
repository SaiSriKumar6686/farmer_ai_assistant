services:
  - type: web
    name: kisan-ai-shield
    env: python
    region: singapore
    plan: free
    rootDir: ai-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 60 --workers 1 --preload app:app
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: EXPO_PUBLIC_GEMINI_API_KEY
        sync: false
      - key: EXPO_PUBLIC_WEATHER_KEY
        sync: false
      - key: EXPO_PUBLIC_DATA_GOV_API_KEY
        sync: false
      - key: HF_HUB_OFFLINE
        value: "1"
